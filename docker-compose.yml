services:
  tpv-article:
    build: .
    image: tpv-article:1.0.0
    container_name: tpv-article
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:mongo@mongo:27017/tpvarticle?authSource=admin
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://host.docker.internal:8761/eureka/
      SPRING_SECURITY_OAUTH2_JWK-URI: http://host.docker.internal:8080/tpv-user/oauth2/jwks
    networks:
      - miw

networks:
  miw:
    external: true

#> docker compose up --build -d